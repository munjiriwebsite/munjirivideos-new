######################
# Build Settings
######################

[build]
  command = "npm run build"
  publish = "dist"

######################
# Redirect Rules
######################

# --------------------------------
# Force HTTPS + non-www canonical
# --------------------------------

[[redirects]]
  from = "http://www.munjiri.com/*"
  to = "https://munjiri.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.munjiri.com/*"
  to = "https://munjiri.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://munjiri.com/*"
  to = "https://munjiri.com/:splat"
  status = 301
  force = true

# --------------------------------
# Remove .html from URLs
# --------------------------------

[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true
